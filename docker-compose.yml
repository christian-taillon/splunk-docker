volumes:
  splunk-var:
  splunk-etc:

services:
  splunk:
    image: docker.io/splunk/splunk:10.2.1-rhel9
    container_name: splunk
    hostname: splunk
    restart: unless-stopped
    environment:
      SPLUNK_START_ARGS: --accept-license
      SPLUNK_GENERAL_TERMS: ${SPLUNK_GENERAL_TERMS}
      SPLUNK_PASSWORD: ${SPLUNK_PASSWORD}
      SPLUNK_LICENSE_URI: ${SPLUNK_LICENSE_URI:-Free}
    ports:
      - "0.0.0.0:8000:8000" # Splunk Web UI
      - "0.0.0.0:8088:8088" # HTTP Event Collector (HEC)
      - "0.0.0.0:8089:8089" # Management API
      - "0.0.0.0:9997:9997" # Forwarder / Indexing Port
    healthcheck:
      test: ["CMD", "curl", "-k", "https://localhost:8089/services/server/info"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
      nproc:
        soft: 65536
        hard: 65536
    volumes:
      - ./licenses:/run/splunk/licenses:ro,Z
      - splunk-var:/opt/splunk/var:Z
      - splunk-etc:/opt/splunk/etc:Z

  caddy:
    image: docker.io/library/caddy:2-alpine
    container_name: caddy-splunk-proxy
    restart: unless-stopped
    ports:
      - "0.0.0.0:8090:8090"
      - "0.0.0.0:8050:8050"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro,Z
    depends_on:
      splunk:
        condition: service_healthy
